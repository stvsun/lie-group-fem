[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lie-group-fem"
version = "0.1.0"
description = "Local Lie-group interpolation and variational field recovery for FEM"
readme = "Readme.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "WaiChing Sun"}]
dependencies = ["numpy>=1.26", "scipy>=1.12"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/stvsun/lie-group-fem"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
